name: Publish GitHub release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Validate release inputs
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$version"
          test -f "docs/releases/v$version.md"
          python scripts/version.py --check
          python scripts/release_body.py "docs/releases/v$version.md" "$RUNNER_TEMP/release.md"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "LiteGate $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release.md"
