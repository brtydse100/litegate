name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "demo/**"
      - "docs/media/litegate-self-service-demo-hd.mp4"
      - "docs/media/litegate-my-key-hd.png"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Assemble static demo
        shell: bash
        run: |
          mkdir -p _site/media
          cp demo/index.html _site/index.html
          cp docs/media/litegate-self-service-demo-hd.mp4 _site/media/
          cp docs/media/litegate-my-key-hd.png _site/media/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@4f4e2c39b1bfcdbb3f6964215e7c10e9e1d50c07 # v4
