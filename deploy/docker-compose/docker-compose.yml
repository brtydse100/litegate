services:
  litegate:
    restart: unless-stopped
    build:
      context: ../..
      dockerfile: deploy/docker-compose/Dockerfile
    ports:
      - "80:8080"
    volumes:
      - ./config.yaml:/app/backend/config.yaml:ro
      # Optional: set organization_mapping_file in config.yaml before enabling.
      # - ./organization.json:/app/backend/organization.json:ro
      - litegate-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # To override a single value without editing config.yaml, use:
    # environment:
    #   - LITELLM_MASTER_KEY=sk-override

volumes:
  litegate-data:
