services:
  litegate:
    image: ghcr.io/brtydse100/litegate:${LITEGATE_VERSION:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "80:8080"
    volumes:
      - ./config.yaml:/app/backend/config.yaml:ro
      # Optional: set organization_mapping_file in config.yaml before enabling.
      # - ./organization.json:/app/backend/organization.json:ro
      - litegate-data:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  litegate-data:
