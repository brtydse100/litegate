# LiteGate uses SQLite and process-local operation limits, so one replica is required.
replicaCount: 1

podSecurityContext:
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

image:
  repository: ghcr.io/brtydse100/litegate
  tag: "2.10.0" # Pin a specific tag in production.
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: litegate.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Use backend environment-variable names. Omitted values use chart/backend
# defaults. Override the placeholder credentials before production use.
env: {}
secretEnv: {}

resources: {}
persistence:
  enabled: true
  existingClaim: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Mount a complete CA bundle from exactly one existing ConfigMap or Secret.
customCA: {}
#  configMap: corporate-ca
#  secret: corporate-ca
#  key: ca-bundle.crt
#  mountPath: /etc/ssl/certs/litegate-custom-ca.pem

extraVolumeMounts: []
extraVolumes: []

# Arbitrary Kubernetes objects rendered with tpl, including OpenShift Routes.
extraObjects: []

nodeSelector: {}
tolerations: []
affinity: {}
