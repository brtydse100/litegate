{{- $legacy := .Values.config | default dict -}}
{{- $data := dict "LITELLM_URL" "http://litellm:4000" "ROOT_URL" "http://litegate.example.com" "LOCAL_AUTH_USERNAME" "admin" "LOCAL_USERS_ENABLED" "true" "LOCAL_USERS_DB_PATH" "/app/backend/data/litegate.db" "AUDIT_RETENTION_DAYS" "90" "AUDIT_CLEANUP_BATCH_SIZE" "1000" -}}
{{- $legacyKeys := dict "litellmUrl" "LITELLM_URL" "litellmUiUrl" "LITELLM_UI_URL" "rootUrl" "ROOT_URL" "logoUrl" "LOGO_URL" "supportTicketUrl" "SUPPORT_TICKET_URL" "localUsersEnabled" "LOCAL_USERS_ENABLED" "localUsersDbPath" "LOCAL_USERS_DB_PATH" "auditRetentionDays" "AUDIT_RETENTION_DAYS" "auditCleanupBatchSize" "AUDIT_CLEANUP_BATCH_SIZE" "adminEmails" "ADMIN_EMAILS" "adminGroups" "ADMIN_GROUPS" "localAuthUsername" "LOCAL_AUTH_USERNAME" "oidcIssuerUrl" "OIDC_ISSUER_URL" "oidcClientId" "OIDC_CLIENT_ID" "oidcRedirectUri" "OIDC_REDIRECT_URI" "oidcScopes" "OIDC_SCOPES" "oidcAuthorizationEndpoint" "OIDC_AUTHORIZATION_ENDPOINT" "oidcTokenEndpoint" "OIDC_TOKEN_ENDPOINT" "oidcJwksUri" "OIDC_JWKS_URI" "oidcGroupsClaim" "OIDC_GROUPS_CLAIM" "oidcRequireTeamMapping" "OIDC_REQUIRE_TEAM_MAPPING" "keyMaxBudget" "KEY_MAX_BUDGET" "keyBudgetDuration" "KEY_BUDGET_DURATION" "keyModels" "KEY_MODELS" "keyDuration" "KEY_DURATION" "keyTpmLimit" "KEY_TPM_LIMIT" "keyRpmLimit" "KEY_RPM_LIMIT" "keyTeamId" "KEY_TEAM_ID" -}}
{{- range $old, $new := $legacyKeys -}}
  {{- if hasKey $legacy $old -}}{{- $_ := set $data $new (printf "%v" (index $legacy $old)) -}}{{- end -}}
{{- end -}}
{{- if hasKey $legacy "oidcGroupTeamMapping" -}}{{- $_ := set $data "OIDC_GROUP_TEAM_MAPPING" (toJson (index $legacy "oidcGroupTeamMapping")) -}}{{- end -}}
{{- range $key, $value := (.Values.env | default dict) -}}{{- $_ := set $data $key (printf "%v" $value) -}}{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "litegate.fullname" . }}
  labels:
    {{- include "litegate.labels" . | nindent 4 }}
data:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
