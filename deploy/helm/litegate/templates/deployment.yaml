apiVersion: apps/v1
kind: Deployment
{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "LiteGate currently requires replicaCount: 1 because local users, audit events, and operation limits use single-instance state" }}
{{- end }}
{{- $customCA := .Values.customCA | default dict }}
{{- if and (hasKey $customCA "configMap") (empty $customCA.configMap) }}
{{- fail "customCA.configMap must not be empty" }}
{{- end }}
{{- if and (hasKey $customCA "secret") (empty $customCA.secret) }}
{{- fail "customCA.secret must not be empty" }}
{{- end }}
{{- if and (hasKey $customCA "configMap") (hasKey $customCA "secret") }}
{{- fail "customCA must specify either configMap or secret, not both" }}
{{- end }}
{{- $hasCustomCA := or (hasKey $customCA "configMap") (hasKey $customCA "secret") }}
{{- if and $customCA (not $hasCustomCA) }}
{{- fail "customCA requires an existing certificate source: set customCA.configMap or customCA.secret; customCA.mountPath is the destination inside the pod" }}
{{- end }}
metadata:
  name: {{ include "litegate.fullname" . }}
  labels:
    {{- include "litegate.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "litegate.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "litegate.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: litegate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "litegate.fullname" . }}
            - secretRef:
                name: {{ include "litegate.fullname" . }}
          {{- if $hasCustomCA }}
          env:
            - name: SSL_CERT_FILE
              value: {{ default "/etc/ssl/certs/litegate-custom-ca.pem" $customCA.mountPath | quote }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.persistence.enabled .Values.extraVolumeMounts $hasCustomCA }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: /app/backend/data
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $hasCustomCA }}
            - name: custom-ca
              mountPath: {{ default "/etc/ssl/certs/litegate-custom-ca.pem" $customCA.mountPath | quote }}
              subPath: {{ default "ca-bundle.crt" $customCA.key | quote }}
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.persistence.enabled .Values.extraVolumes $hasCustomCA }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "litegate.fullname" .)) .Values.persistence.existingClaim }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if hasKey $customCA "configMap" }}
        - name: custom-ca
          configMap:
            name: {{ $customCA.configMap | quote }}
        {{- else if hasKey $customCA "secret" }}
        - name: custom-ca
          secret:
            secretName: {{ $customCA.secret | quote }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
