apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litegate.fullname" . }}
  labels:
    {{- include "litegate.labels" . | nindent 4 }}
type: Opaque
stringData:
  LITELLM_MASTER_KEY: {{ .Values.config.litellmMasterKey | quote }}
  JWT_SECRET: {{ .Values.config.jwtSecret | quote }}
  {{- if .Values.config.jwtPreviousSecrets }}
  JWT_PREVIOUS_SECRETS: {{ .Values.config.jwtPreviousSecrets | quote }}
  {{- end }}
  {{- if .Values.config.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ .Values.config.oidcClientSecret | quote }}
  {{- end }}
  {{- if .Values.config.localAuthPassword }}
  LOCAL_AUTH_PASSWORD: {{ .Values.config.localAuthPassword | quote }}
  {{- end }}
  {{- if .Values.config.managementApiKey }}
  MANAGEMENT_API_KEY: {{ .Values.config.managementApiKey | quote }}
  {{- end }}
