{{- $legacy := .Values.config | default dict -}}
{{- $data := dict "LITELLM_MASTER_KEY" "sk-your-litellm-master-key" "JWT_SECRET" "change-me-min-32-chars-random-string" "LOCAL_AUTH_PASSWORD" "changeme" -}}
{{- $legacyKeys := dict "litellmMasterKey" "LITELLM_MASTER_KEY" "jwtSecret" "JWT_SECRET" "jwtPreviousSecrets" "JWT_PREVIOUS_SECRETS" "oidcClientSecret" "OIDC_CLIENT_SECRET" "localAuthPassword" "LOCAL_AUTH_PASSWORD" "managementApiKey" "MANAGEMENT_API_KEY" -}}
{{- range $old, $new := $legacyKeys -}}
  {{- if hasKey $legacy $old -}}{{- $_ := set $data $new (printf "%v" (index $legacy $old)) -}}{{- end -}}
{{- end -}}
{{- range $key, $value := (.Values.secretEnv | default dict) -}}{{- $_ := set $data $key (printf "%v" $value) -}}{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "litegate.fullname" . }}
  labels:
    {{- include "litegate.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := $data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
